services:
  api:
    build:
      context: ../..
      dockerfile: service/deploy/Dockerfile
    env_file: .env
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  worker:
    build:
      context: ../..
      dockerfile: service/deploy/Dockerfile
    command: [node, --import, tsx, service/src/worker.ts]
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
