name: Release Juiced CLI
run-name: Prepare ${{ inputs.commit || github.sha }}
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit selected for release
        required: true
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  # Background work follows main; selected commits and tags have separate, durable runs.
  group: release-${{ github.event_name == 'workflow_dispatch' && format('selected-{0}', inputs.commit) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  prepared:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 12 || 3 }}
    outputs:
      run_id: ${{ steps.lookup.outputs.run_id }}
      source_sha: ${{ steps.lookup.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_COMMIT: ${{ inputs.commit }}
        run: node scripts/prepared-release.mjs

  # Two Intel shards + ARM tests + both Mac packagers fit five macOS slots.
  # Retain serial execution inside each shard to avoid fixture contention.
  native-tests:
    needs: prepared
    timeout-minutes: 10
    if: needs.prepared.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, shard: '1/1', concurrency: 4 }
          - { runner: ubuntu-22.04-arm, shard: '1/1', concurrency: 4 }
          - { runner: macos-14, shard: '1/1', concurrency: 4 }
          - { runner: macos-15-intel, shard: '1/2', concurrency: 1 }
          - { runner: macos-15-intel, shard: '2/2', concurrency: 1 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepared.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Native CLI tests
        run: node --import tsx --test --test-concurrency=${{ matrix.concurrency }} --test-shard=${{ matrix.shard }} test/*.test.ts
      - name: Release tooling tests
        if: matrix.runner == 'ubuntu-22.04'
        run: npm run test:release

  package:
    needs: prepared
    timeout-minutes: 10
    if: needs.prepared.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
          - { runner: macos-14, target: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepared.outputs.source_sha }}
      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juiced-node-cache
          key: juiced-node-${{ matrix.target }}-${{ steps.node.outputs.node-version }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run build:runtime
      - run: npm run build:release
        timeout-minutes: 5
        env:
          JUICED_NODE_CACHE: ${{ runner.temp }}/juiced-node-cache
      - name: Install the actual release with no Node or npm on PATH
        run: npm run test:installer -- dist/releases/juiced-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: juiced-${{ matrix.target }}
          retention-days: 7
          path: |
            dist/releases/*.tar.gz
            dist/releases/*.sha256
          if-no-files-found: error

  qualified:
    needs: [prepared, native-tests, package]
    timeout-minutes: 3
    if: ${{ !cancelled() && needs.prepared.result == 'success' && (needs.prepared.outputs.run_id != '' || (needs.native-tests.result == 'success' && needs.package.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepared.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: juiced-*
          path: dist/releases
          merge-multiple: true
          run-id: ${{ needs.prepared.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      # Call the stable export, not the CLI: selected commits may predate any source-sha
      # option, and their CLI would verify against GITHUB_SHA (main's tip on dispatch).
      - name: Verify archive checksums, commits, versions and runtime identities
        env:
          SOURCE_SHA: ${{ needs.prepared.outputs.source_sha }}
        run: |
          node --input-type=module > dist/releases/qualified.json <<'JS'
          import { readFile } from 'node:fs/promises';
          import { verifyArtifacts } from './scripts/release-artifacts.mjs';
          const { version } = JSON.parse(await readFile('package.json'));
          console.log(JSON.stringify(await verifyArtifacts('dist/releases', { sha: process.env.SOURCE_SHA, version })));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: release-qualified
          retention-days: 7
          path: dist/releases/qualified.json
      - name: Summarize preparation
        env:
          PREPARED_RUN: ${{ needs.prepared.outputs.run_id }}
          SOURCE_SHA: ${{ needs.prepared.outputs.source_sha }}
        run: |
          echo "Qualified commit $SOURCE_SHA; reused run: ${PREPARED_RUN:-fresh build}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Cached native artifacts skip matrix jobs. Override implicit success() so
    # those skipped ancestors do not suppress an otherwise qualified tag.
    if: ${{ !cancelled() && needs.prepared.result == 'success' && needs.qualified.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [prepared, qualified]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepared.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: juiced-*
          path: dist/releases
          merge-multiple: true
          run-id: ${{ needs.prepared.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/release-artifacts.mjs
      - name: Create a draft release from qualified archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
          release_flags=(--draft)
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${release_flags[@]}" \
            dist/releases/*.tar.gz dist/releases/SHA256SUMS service/public/install.sh
