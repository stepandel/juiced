name: Release Juiced CLI
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:release
      - name: Install the actual release with no Node or npm on PATH
        run: npm run test:installer -- dist/releases/juiced-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: juiced-${{ matrix.target }}
          path: |
            dist/releases/*.tar.gz
            dist/releases/*.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist/releases
          merge-multiple: true
      - name: Assemble checksums and create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat dist/releases/*.sha256 > dist/releases/SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
            dist/releases/*.tar.gz dist/releases/SHA256SUMS public/install.sh
